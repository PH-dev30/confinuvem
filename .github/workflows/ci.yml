name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validar título do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Validar mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  markdownlint:
    name: Validar Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  quality-gate:
    name: CI — resultado geral
    if: always()
    needs:
      - pr-title
      - commitlint
      - markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        env:
          PR_TITLE: ${{ needs.pr-title.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          MARKDOWNLINT: ${{ needs.markdownlint.result }}
        run: |
          for result in "$PR_TITLE" "$COMMITLINT" "$MARKDOWNLINT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A CI falhou: um dos jobs terminou com estado $result."
              exit 1
            fi
          done
          echo "Todos os jobs aplicáveis foram aprovados."
